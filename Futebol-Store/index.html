<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futebol Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="bola"></div>
        <p class="subtitulo">LOJA DE ARTIGOS ESPORTIVOS</p>
        <h1>LUCAS IMPORTS</h1>
        <p class="frase">Importados e Originais.</p>
    </header>

    <main>
        <section class="busca">
            <label for="filtro"> Encontre seu produto</label>
            <form id="form-busca">
                <input type="text" id="filtro" placeholder="Digite nome, categoria ou produto...">
                <button type="submit">PESQUISAR</button>
            </form>
        </section>

        <section class="catalogo" id="div-catalogo"></section>
    </main>

    <footer>
        <p> LUQINHAS STORE</p>
        <span>©Todos os direitos reservados para professor Rafael</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
